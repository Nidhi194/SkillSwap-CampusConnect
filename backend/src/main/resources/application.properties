spring.application.name=skillswap-campus-api

server.port=${PORT:8080}

# Auth tokens: set AUTH_SECRET to keep logins valid across restarts.
app.auth.secret=${AUTH_SECRET:}
app.auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:12}

# Admin bootstrap (only used when no admin exists)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrator}

# Frontend origins allowed by CORS (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://localhost:5501,http://localhost:5502,http://127.0.0.1:5500,http://127.0.0.1:5501,http://127.0.0.1:5502}
