<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Students - SkillSwap Campus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='15' font-weight='700' text-anchor='middle' fill='white'%3ESS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="find-students-page">

  <!-- Top Navigation Bar -->
  <header class="site-header">
    <div id="navbar-container"></div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <!-- Page Header -->
      <div class="directory-hero">
        <h1 class="page-title">Find Students</h1>
        <p class="page-description">Connect with peers, exchange knowledge, and grow together.</p>
      </div>

      <!-- Search & Filters Bar -->
      <div class="card search-filter-card">
        <div class="filters-row">
          <div class="directory-search">
            <label class="sr-only" for="search-input">Search by name or skill</label>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
            <input
              type="text" 
              id="search-input" 
              class="form-input"
              placeholder="Search by name, department, or skill"
              autocomplete="off"
            >
          </div>

          <div class="directory-filter-chip">
            <label for="filter-skill">Skill</label>
            <select id="filter-skill" class="form-select">
              <!-- Populated via JS -->
            </select>
          </div>

          <div class="directory-filter-chip">
            <label for="filter-department">Department</label>
            <select id="filter-department" class="form-select">
              <!-- Populated via JS -->
            </select>
          </div>

          <div class="filter-actions">
            <button type="button" class="directory-clear-link" id="btn-clear-filters" hidden>Clear filters</button>
          </div>
        </div>
      </div>

      <!-- Results Count -->
      <div class="directory-results-meta" id="results-count" role="status" aria-live="polite">
        Loading students...
      </div>

      <!-- Students Grid -->
      <div class="students-grid directory-skeleton-grid" id="directory-skeleton-grid" aria-hidden="true">
        <div class="student-skeleton-card"><span></span><div></div><i></i><i></i></div>
        <div class="student-skeleton-card"><span></span><div></div><i></i><i></i></div>
        <div class="student-skeleton-card"><span></span><div></div><i></i><i></i></div>
        <div class="student-skeleton-card"><span></span><div></div><i></i><i></i></div>
        <div class="student-skeleton-card"><span></span><div></div><i></i><i></i></div>
        <div class="student-skeleton-card"><span></span><div></div><i></i><i></i></div>
      </div>
      <div class="students-grid" id="students-grid" hidden>
        <!-- Rendered via JS -->
      </div>
      <nav class="directory-pagination" id="directory-pagination" aria-label="Student results pages"></nav>

    </div>
  </main>

  <!-- Send Request Modal -->
  <div class="modal-overlay" id="send-request-modal" role="dialog" aria-modal="true" aria-labelledby="modal-req-title">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-req-title">Send Skill Exchange Request</h3>
        <button type="button" class="modal-close" id="btn-close-request-modal" aria-label="Close modal">&times;</button>
      </div>
      <form id="send-request-modal-form">
        <div class="modal-body">
          <p style="font-size: 14px; margin-bottom: 16px;">
            Propose a skill exchange with <strong id="modal-request-receiver-name">Student</strong>:
          </p>

          <div class="form-group">
            <label for="request-skill-wanted" class="form-label">Skill you want to learn from them</label>
            <select id="request-skill-wanted" class="form-select">
              <!-- Populated via JS based on target's skillsTeach -->
            </select>
          </div>

          <div class="form-group">
            <label for="request-skill-offered" class="form-label">Skill you offer to teach them</label>
            <select id="request-skill-offered" class="form-select">
              <!-- Populated via JS based on current user's skillsTeach -->
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-request-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Send Request</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-content">
      <div><strong>SkillSwap Campus</strong> &mdash; Peer learning made simple.</div>
      <div>
        <a href="dashboard.html">Dashboard</a> &bull;
        <a href="profile.html">My Profile</a> &bull;
        <a href="requests.html">Requests</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/find-students.js"></script>
</body>
</html>
